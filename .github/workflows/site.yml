# Publishes the website (site/, put together by scripts/build-site.mjs) to GitHub Pages, at
# https://jpesce.github.io/slides-companion-for-google-slides/, when a push to main changes it or
# anything it takes from the extension and the brand. Putting it together needs nothing installed:
# the pictures in site/media/ are drawn on a computer with the demo's stills (npm run site:pictures).
name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build-site.mjs
      - scripts/build-brand.mjs
      - extension/companion-motion.js
      - extension/illustrations.js
      - extension/_locales/**
      - brand/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v5
